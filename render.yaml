# ==============================================================================
# Tenders.tn - Render.com Deployment Blueprint
# ==============================================================================
services:
  - type: web
    name: tenders-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: '3.12.0'
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
    disk:
      name: tenders-data
      mountPath: /data
      sizeGB: 1
